# -----------------------------------------------------------------------------
# FONT SETTINGS
# -----------------------------------------------------------------------------
font_family FiraCode
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

disable_ligatures cursor

# -----------------------------------------------------------------------------
# THEME & APPEARANCE
# -----------------------------------------------------------------------------
include current-theme.conf
# include themes/catppuccin-mocha.conf

background_opacity 0.95
dynamic_background_opacity yes
background_blur 15

# -----------------------------------------------------------------------------
# CURSOR & SELECTION
# -----------------------------------------------------------------------------
cursor_shape block
cursor_blink_interval 0
cursor_text_color background

# Cursor trail animation (Supported in Kitty 0.36.0+ / 0.49.2 upstream; ignored safely on older versions)
cursor_trail 20
cursor_trail_color #EEDCC1

# -----------------------------------------------------------------------------
# WINDOW LAYOUT
# -----------------------------------------------------------------------------
remember_window_size yes
initial_window_width 1280
initial_window_height 720
window_padding_width 10

# Enabled window layouts (Splits layout as primary for modern tiled workflow)
enabled_layouts splits,stack,fat,tall,grid

window_border_width 1pt
draw_minimal_borders yes

hide_window_decorations titlebar-only

# -----------------------------------------------------------------------------
# SCROLLBACK
# -----------------------------------------------------------------------------
scrollback_lines 10000

# -----------------------------------------------------------------------------
# PERFORMANCE
# -----------------------------------------------------------------------------
repaint_delay 10
input_delay 2

# Sync screen updates to the monitor's refresh rate to prevent tearing.
sync_to_monitor yes

# -----------------------------------------------------------------------------
# KEYBOARD SHORTCUTS
# -----------------------------------------------------------------------------
# Set kitty_mod to Alt for easier access.
kitty_mod alt

# --- Clipboard ---
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# --- Window & Split Management ---
# Create splits (inheriting current directory)
map kitty_mod+enter launch --location=split --cwd=current
map alt+\           launch --location=vsplit --cwd=current
map alt+-           launch --location=hsplit --cwd=current
map kitty_mod+w     close_window
map kitty_mod+n     new_os_window_with_cwd

# Split navigation (Vim hjkl navigation across splits)
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

# Layout switching
map alt+space next_layout
map alt+z     toggle_layout stack
map alt+g     set_layout grid
map alt+s     set_layout stack

# System monitoring overlay (btop)
map kitty_mod+m launch --type=overlay btop


# --- Tab Management ---
map kitty_mod+t new_tab_with_cwd
map kitty_mod+q close_tab
map kitty_mod+right next_tab
map kitty_mod+left previous_tab

# --- Font Size ---
map kitty_mod+plus change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0 change_font_size all 0

# Resize window / splits (Vim hjkl & Arrow keys)
map alt+shift+h     resize_window wider 2
map alt+shift+l     resize_window narrower 2
map alt+shift+k     resize_window taller 2
map alt+shift+j     resize_window shorter 2
map alt+shift+left  resize_window wider 2
map alt+shift+right resize_window narrower 2
map alt+shift+up    resize_window taller 2
map alt+shift+down  resize_window shorter 2
map alt+shift+0     resize_window reset


# --- Opacity Control ---
# map kitty_mod+page_up   set_background_opacity +0.05
# map kitty_mod+page_down set_background_opacity -0.05

# --- Hints Kitten (powerful text selection) ---
map kitty_mod+e kitten hints --type url
map kitty_mod+p kitten hints --type path --program -
map kitty_mod+k kitten hints --type line --program -

# --- Reload Config ---
map kitty_mod+f5 load_config_file

# -----------------------------------------------------------------------------
# ADVANCED & OS-SPECIFIC
# -----------------------------------------------------------------------------
# Disable the audio bell.
enable_audio_bell no

# Notify when long-running commands finish.
notify_on_cmd_finish unfocused 10.0

# Allow remote control for advanced scripting (socket-only blocks escape sequence injection).
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Linux-specific tweaks.
linux_display_server auto

# Shell integration for better shell interaction.
shell_integration enabled

# URL handling
open_url_with default
url_style curly

tab_bar_style powerline
# Atau pakai 'slant' atau 'fade' biar lebih estetik

# Tab styling (Colors inherited from Kaolin Temple current-theme.conf)
active_tab_font_style   bold
inactive_tab_font_style normal
